example_mongo_to_s3:
  dag_id: example_mongo_to_s3
  params: {}
  default_args:
    start_date:
      __type__: pendulum.naive
      __args__:
      - 2026
      - 1
      - 1
      - 0
      - 0
      - 0
      - 0
      fold: 0
  schedule: '@once'
  tasks:
    create_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      task_id: create_s3_bucket
      bucket_name: test-mongo-to-s3-bucket
      dependencies: []
    mongo_to_s3_job:
      operator: airflow.providers.amazon.aws.transfers.mongo_to_s3.MongoToS3Operator
      task_id: mongo_to_s3_job
      mongo_collection: test-mongo-collection
      mongo_query:
        status: OK
      s3_bucket: test-mongo-to-s3-bucket
      s3_key: test-mongo-to-s3-key
      mongo_db: test-mongo-database
      replace: true
      dependencies:
      - create_s3_bucket
    delete_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      task_id: delete_s3_bucket
      bucket_name: test-mongo-to-s3-bucket
      force_delete: true
      trigger_rule: all_done
      dependencies:
      - mongo_to_s3_job
  catchup: false
  dag_display_name: example_mongo_to_s3
  start_date:
    __type__: pendulum.naive
    __args__:
    - 2026
    - 1
    - 1
    - 0
    - 0
    - 0
    - 0
    fold: 0
  tags: []
