dynamic_dag_sales:
  dag_id: dynamic_dag_sales
  params: {}
  default_args:
    owner: airflow
    start_date:
      __type__: pendulum.naive
      __args__:
      - 2026
      - 1
      - 1
      - 0
      - 0
      - 0
      - 0
      fold: 0
    retries: 1
    retry_delay:
      __type__: datetime.timedelta
      seconds: 300.0
  schedule: 0 1 * * *
  tasks:
    start:
      operator: airflow.providers.standard.operators.bash.BashOperator
      task_id: start
      bash_command: "echo 'Starting processing for sales'"
      dependencies: []
    process_transactions:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: process_transactions
      python_callable: dag_gen_config.process_data
      op_kwargs:
        data_source: /data/sales/transactions
      dependencies:
      - start
    process_customers:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: process_customers
      python_callable: dag_gen_config.process_data
      op_kwargs:
        data_source: /data/sales/customers
      dependencies:
      - start
    process_products:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: process_products
      python_callable: dag_gen_config.process_data
      op_kwargs:
        data_source: /data/sales/products
      dependencies:
      - start
    end:
      operator: airflow.providers.standard.operators.bash.BashOperator
      task_id: end
      bash_command: "echo 'Completed processing for sales'"
      dependencies:
      - process_transactions
      - process_products
      - process_customers
  catchup: false
  dag_display_name: dynamic_dag_sales
  description: Dynamically generated DAG for sales
  start_date:
    __type__: pendulum.naive
    __args__:
    - 2026
    - 1
    - 1
    - 0
    - 0
    - 0
    - 0
    fold: 0
  tags: []
