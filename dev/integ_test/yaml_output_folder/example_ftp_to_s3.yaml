example_ftp_to_s3:
  dag_id: example_ftp_to_s3
  params: {}
  default_args:
    start_date:
      __type__: pendulum.naive
      __args__:
      - 2026
      - 1
      - 1
      - 0
      - 0
      - 0
      - 0
      fold: 0
  schedule: '@once'
  tasks:
    create_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      task_id: create_s3_bucket
      bucket_name: test-ftp-to-s3-bucket
      dependencies: []
    ftp_to_s3_task:
      operator: airflow.providers.amazon.aws.transfers.ftp_to_s3.FTPToS3Operator
      task_id: ftp_to_s3_task
      ftp_path: /tmp/ftp_path
      s3_bucket: test-ftp-to-s3-bucket
      s3_key: test-ftp-to-s3-key
      replace: true
      dependencies:
      - create_s3_bucket
    delete_s3_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      task_id: delete_s3_bucket
      bucket_name: test-ftp-to-s3-bucket
      force_delete: true
      trigger_rule: all_done
      dependencies:
      - ftp_to_s3_task
  catchup: false
  dag_display_name: example_ftp_to_s3
  start_date:
    __type__: pendulum.naive
    __args__:
    - 2026
    - 1
    - 1
    - 0
    - 0
    - 0
    - 0
    fold: 0
  tags: []
