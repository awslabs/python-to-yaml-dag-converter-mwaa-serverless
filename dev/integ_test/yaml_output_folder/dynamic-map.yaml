dynamic-map:
  dag_id: dynamic-map
  params: {}
  default_args:
    start_date:
      __type__: pendulum.naive
      __args__:
      - 2026
      - 4
      - 2
      - 0
      - 0
      - 0
      - 0
      fold: 0
  schedule: '@daily'
  tasks:
    get_input:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: get_input
      python_callable: dtm_xcom_mapped.list_some_names
      dependencies: []
    count_lines:
      operator: airflow.providers.standard.operators.python.PythonOperator
      dependencies:
      - get_input
      expand:
        op_args: get_input.output
      python_callable: dtm_xcom_mapped.count_lines_func
    total:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: total
      python_callable: dtm_xcom_mapped.total_func
      op_kwargs:
        lines: "{{ task_instance.xcom_pull(task_ids='count_lines', key='return_value')\
          \ }}"
      dependencies:
      - count_lines
  catchup: false
  dag_display_name: dynamic-map
  start_date:
    __type__: pendulum.naive
    __args__:
    - 2026
    - 4
    - 2
    - 0
    - 0
    - 0
    - 0
    fold: 0
  tags: []
