example_ec2:
  dag_id: example_ec2
  params: {}
  default_args:
    owner: airflow
    start_date:
      __type__: pendulum.naive
      __args__:
      - 2026
      - 1
      - 1
      - 0
      - 0
      - 0
      - 0
      fold: 0
    retries: 1
    retry_delay:
      __type__: datetime.timedelta
      seconds: 300.0
  schedule: '@daily'
  tasks:
    env_id:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: env_id
      python_callable: ec2.sys_test_context_task
      dependencies: []
    key_name:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: key_name
      python_callable: ec2.create_key_pair
      op_kwargs:
        key_name: "{{ task_instance.xcom_pull(task_ids='env_id', key='return_value')\
          \ }}_key_pair"
      dependencies:
      - env_id
    image_id:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: image_id
      python_callable: ec2.get_latest_ami_id
      dependencies:
      - key_name
    create_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2CreateInstanceOperator
      task_id: create_instance
      image_id: "{{ task_instance.xcom_pull(task_ids='image_id', key='return_value')\
        \ }}"
      max_count: 1
      min_count: 1
      config:
        InstanceType: t3.micro
        KeyName: "{{ task_instance.xcom_pull(task_ids='key_name', key='return_value')\
          \ }}"
        TagSpecifications:
        - ResourceType: instance
          Tags:
          - Key: Name
            Value: "{{ task_instance.xcom_pull(task_ids='env_id', key='return_value')\
              \ }}-instance"
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
        HibernationOptions:
          Configured: true
        BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            DeleteOnTermination: true
      wait_for_completion: true
      dependencies:
      - image_id
      - key_name
    instance_id:
      operator: airflow.providers.standard.operators.python.PythonOperator
      task_id: instance_id
      python_callable: ec2.parse_response
      op_args:
      - "{{ task_instance.xcom_pull(task_ids='create_instance', key='return_value')\
        \ }}"
      dependencies:
      - create_instance
    stop_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2StopInstanceOperator
      task_id: stop_instance
      instance_id: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      trigger_rule: all_done
      dependencies:
      - instance_id
    start_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2StartInstanceOperator
      task_id: start_instance
      instance_id: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      dependencies:
      - stop_instance
      - instance_id
    await_instance:
      operator: airflow.providers.amazon.aws.sensors.ec2.EC2InstanceStateSensor
      task_id: await_instance
      instance_id: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      target_state: running
      dependencies:
      - start_instance
      - instance_id
    reboot_instace:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2RebootInstanceOperator
      task_id: reboot_instace
      instance_ids: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      wait_for_completion: true
      dependencies:
      - await_instance
      - instance_id
    hibernate_instace:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2HibernateInstanceOperator
      task_id: hibernate_instace
      instance_ids: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      wait_for_completion: true
      poll_interval: 60
      max_attempts: 40
      dependencies:
      - reboot_instace
      - instance_id
    terminate_instance:
      operator: airflow.providers.amazon.aws.operators.ec2.EC2TerminateInstanceOperator
      task_id: terminate_instance
      instance_ids: "{{ task_instance.xcom_pull(task_ids='instance_id', key='return_value')\
        \ }}"
      wait_for_completion: true
      trigger_rule: all_done
      dependencies:
      - hibernate_instace
      - instance_id
  catchup: false
  dag_display_name: example_ec2
  start_date:
    __type__: pendulum.naive
    __args__:
    - 2026
    - 1
    - 1
    - 0
    - 0
    - 0
    - 0
    fold: 0
  tags: []
