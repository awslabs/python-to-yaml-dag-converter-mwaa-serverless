example_sagemaker_unified_studio_notebook:
  dag_id: example_sagemaker_unified_studio_notebook
  params: {}
  default_args: {}
  schedule: '@once'
  tasks:
    notebook-task:
      operator: airflow.providers.amazon.aws.operators.sagemaker_unified_studio_notebook.SageMakerUnifiedStudioNotebookOperator
      task_id: notebook-task
      aws_conn_id: aws_datazone_notebook
      notebook_identifier: NOTEBOOK_ID
      domain_identifier: DOMAIN_ID
      owning_project_identifier: PROJECT_ID
      client_token: idempotency-token-1793284055
      notebook_parameters:
        param1: value1
        param2: value2
      compute_configuration:
        instanceType: sc.m5.large
      timeout_configuration:
        runTimeoutInMinutes: 1440
      wait_for_completion: true
      waiter_delay: 30
      deferrable: false
      dependencies: []
    notebook-sensor-task:
      operator: airflow.providers.amazon.aws.sensors.sagemaker_unified_studio_notebook.SageMakerUnifiedStudioNotebookSensor
      task_id: notebook-sensor-task
      aws_conn_id: aws_datazone_notebook
      domain_identifier: DOMAIN_ID
      owning_project_identifier: PROJECT_ID
      notebook_identifier: NOTEBOOK_ID
      notebook_run_id: "{{ task_instance.xcom_pull(task_ids='notebook-task', key='notebook_run_id')\
        \ }}"
      dependencies:
      - notebook-task
    notebook-a-task:
      operator: airflow.providers.amazon.aws.operators.sagemaker_unified_studio_notebook.SageMakerUnifiedStudioNotebookOperator
      task_id: notebook-a-task
      aws_conn_id: aws_datazone_notebook
      notebook_identifier: NOTEBOOK_ID
      domain_identifier: DOMAIN_ID
      owning_project_identifier: PROJECT_ID
      wait_for_completion: true
      deferrable: false
      dependencies:
      - notebook-sensor-task
    notebook-b-task:
      operator: airflow.providers.amazon.aws.operators.sagemaker_unified_studio_notebook.SageMakerUnifiedStudioNotebookOperator
      task_id: notebook-b-task
      aws_conn_id: aws_datazone_notebook
      notebook_identifier: NOTEBOOK_B_ID
      domain_identifier: DOMAIN_ID
      owning_project_identifier: PROJECT_ID
      notebook_parameters:
        employee_name: "{{ task_instance.xcom_pull(task_ids='notebook-a-task', key='NOTEBOOK_OUTPUT.name')\
          \ }}"
        employee_age: "{{ task_instance.xcom_pull(task_ids='notebook-a-task', key='NOTEBOOK_OUTPUT.age')\
          \ }}"
      wait_for_completion: true
      deferrable: false
      dependencies:
      - notebook-a-task
  catchup: false
  dag_display_name: example_sagemaker_unified_studio_notebook
  start_date:
    __type__: pendulum.naive
    __args__:
    - 2021
    - 1
    - 1
    - 0
    - 0
    - 0
    - 0
    fold: 0
  tags: []
