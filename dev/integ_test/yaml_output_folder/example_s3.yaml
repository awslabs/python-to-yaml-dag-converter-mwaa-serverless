example_s3:
  dag_id: example_s3
  params: {}
  default_args:
    owner: airflow
    start_date:
      __type__: pendulum.naive
      __args__:
      - 2026
      - 7
      - 6
      - 0
      - 0
      - 0
      - 0
      fold: 0
    retries: 1
  schedule: '@daily'
  tasks:
    create_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      task_id: create_bucket
      bucket_name: py2yml-my-personal-test-s3-bucket
      dependencies: []
    create_bucket_2:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateBucketOperator
      task_id: create_bucket_2
      bucket_name: py2yml-my-personal-test-s3-bucket-v2
      dependencies:
      - create_bucket
    create_object:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateObjectOperator
      task_id: create_object
      s3_bucket: py2yml-my-personal-test-s3-bucket
      s3_key: py2yml-key
      data: |2

            apple,0.5
            milk,2.5
            bread,4.0
      replace: true
      dependencies:
      - create_bucket_2
    create_object_2:
      operator: airflow.providers.amazon.aws.operators.s3.S3CreateObjectOperator
      task_id: create_object_2
      s3_bucket: py2yml-my-personal-test-s3-bucket
      s3_key: py2yml-key-v2
      data: |2

            apple,0.5
            milk,2.5
            bread,4.0
      replace: true
      dependencies:
      - create_object
    list_keys:
      operator: airflow.providers.amazon.aws.operators.s3.S3ListOperator
      task_id: list_keys
      bucket: py2yml-my-personal-test-s3-bucket
      prefix: ''
      dependencies:
      - create_object_2
    delete_bucket:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      task_id: delete_bucket
      bucket_name: py2yml-my-personal-test-s3-bucket
      force_delete: true
      dependencies:
      - list_keys
    delete_bucket_2:
      operator: airflow.providers.amazon.aws.operators.s3.S3DeleteBucketOperator
      task_id: delete_bucket_2
      bucket_name: py2yml-my-personal-test-s3-bucket-v2
      force_delete: true
      dependencies:
      - delete_bucket
  catchup: false
  dag_display_name: example_s3
  start_date:
    __type__: pendulum.naive
    __args__:
    - 2026
    - 7
    - 6
    - 0
    - 0
    - 0
    - 0
    fold: 0
  tags: []
